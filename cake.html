<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>20 Magical Candles for Chubbi 🎂</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Arial Rounded MT Bold", "Helvetica Rounded", Arial, sans-serif;
      }

      body {
        background: transparent;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
        color: #ffffff;
      }

      .balloon {
        position: absolute;
        width: 40px;
        height: 50px;
        border-radius: 50%;
        animation: float 15s infinite ease-in-out;
        z-index: 1;
        pointer-events: none;
      }

      @keyframes float {
        0% { transform: translateY(100vh) translateX(0); opacity: 1; }
        100% { transform: translateY(-100px) translateX(50px); opacity: 0; }
      }

      .confetti {
        position: absolute;
        width: 10px;
        height: 10px;
        opacity: 0;
        animation: confettiFall 5s infinite ease-out;
        z-index: 1;
        pointer-events: none;
      }

      @keyframes confettiFall {
        0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
        100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
      }

      .cake-title {
        text-align: center;
        font-size: 2.2rem;
        margin-bottom: 1.5rem;
        color: #ffffff;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.9), 0 0 30px rgba(255, 20, 147, 0.8);
        z-index: 10;
      }

      .cake-container {
        position: relative;
        width: 360px;
        height: 330px;
        margin: 10px auto;
        z-index: 10;
      }

      /* Cake Layers */
      .cake {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 280px;
        height: 130px;
        background: linear-gradient(to right, #ff85a2, #ff99b6);
        border-radius: 12px 12px 0 0;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }

      .cake:before {
        content: "";
        position: absolute;
        top: -45px;
        left: 10%;
        width: 80%;
        height: 45px;
        background: linear-gradient(to right, #fc6c85, #ff85a2);
        border-radius: 12px 12px 0 0;
      }

      .cake:after {
        content: "";
        position: absolute;
        top: -85px;
        left: 20%;
        width: 60%;
        height: 40px;
        background: linear-gradient(to right, #ffb3c6, #ffcce6);
        border-radius: 12px 12px 0 0;
      }

      /* 20 Candles Layout: 2 Rows */
      .candle-row {
        position: absolute;
        width: 100%;
        display: flex;
        justify-content: center;
        z-index: 15;
      }

      /* Top row: 10 candles */
      .candle-row-top {
        top: -115px;
        gap: 12px;
      }

      /* Lower row: 10 candles */
      .candle-row-bottom {
        top: -65px;
        gap: 14px;
      }

      .candle {
        position: relative;
        width: 7px;
        height: 28px;
        background: linear-gradient(to top, #ffff99, #ff9933);
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .flame {
        position: absolute;
        top: -18px;
        left: 50%;
        transform: translateX(-50%);
        width: 10px;
        height: 18px;
        background: radial-gradient(ellipse at center, #ffff00, #ff9900, #ff6600);
        border-radius: 50% 50% 20% 20%;
        box-shadow: 0 0 10px #ff9900, 0 0 18px #ffff00;
        opacity: 1;
        animation: flicker 0.5s infinite alternate;
        z-index: 20;
      }

      @keyframes flicker {
        0% { transform: translateX(-50%) scale(1); opacity: 1; }
        100% { transform: translateX(-50%) scale(1.15); opacity: 0.9; }
      }

      .candle.blown .flame {
        opacity: 0;
        animation: none;
        transition: opacity 0.3s ease-out;
      }

      .smoke {
        position: absolute;
        top: -22px;
        left: 50%;
        transform: translateX(-50%);
        width: 6px;
        height: 0;
        background: rgba(220, 220, 220, 0.6);
        border-radius: 10px;
        opacity: 0;
        transition: all 0.5s ease;
      }

      .candle.blown .smoke {
        height: 26px;
        opacity: 0.8;
        animation: smokeRise 2s forwards;
      }

      @keyframes smokeRise {
        0% { height: 0; opacity: 0; }
        20% { height: 10px; opacity: 0.8; }
        100% { height: 26px; opacity: 0; transform: translateX(-50%) translateY(-25px) scale(1.4); }
      }

      .sparkle {
        position: absolute;
        width: 4px;
        height: 4px;
        background-color: #ffffff;
        border-radius: 50%;
        box-shadow: 0 0 5px #ffff99;
        opacity: 0;
        z-index: 25;
      }

      @keyframes sparkle {
        0% { transform: scale(0) rotate(0deg); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: scale(1.5) rotate(90deg); opacity: 0; }
      }

      /* Enhanced Wish Message Popup */
      .wish-message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) scale(0);
        background: rgba(25, 12, 35, 0.94);
        padding: 30px;
        border-radius: 26px;
        box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7), 0 0 35px rgba(255, 105, 180, 0.7);
        text-align: center;
        z-index: 10001;
        opacity: 0;
        width: 90%;
        max-width: 450px;
        transition: all 0.5s ease;
        border: 2px solid rgba(255, 182, 193, 0.8);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .wish-message.show {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
        animation: bounceIn 0.8s;
      }

      @keyframes bounceIn {
        0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
        60% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
        100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      }

      .wish-message h2 {
        color: #ffffff;
        font-size: 28px;
        margin-bottom: 15px;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
      }

      .wish-message p {
        color: #ffd6f1;
        font-size: 19px;
        margin-bottom: 22px;
        line-height: 1.55;
        font-weight: 500;
      }

      .firework {
        position: absolute;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        opacity: 0;
        z-index: 5;
      }

      @keyframes firework {
        0% {
          transform: scale(0);
          opacity: 1;
          box-shadow: 0 0 0 0px rgba(255, 255, 255, 0.9),
            0 0 0 0px rgba(255, 0, 102, 0.9), 0 0 0 0px rgba(255, 255, 0, 0.9);
        }
        100% {
          transform: scale(1);
          opacity: 0;
          box-shadow: 0 0 0 60px rgba(255, 255, 255, 0),
            0 0 0 120px rgba(255, 0, 102, 0), 0 0 0 180px rgba(255, 255, 0, 0);
        }
      }

      .nav-buttons {
        position: fixed;
        bottom: 30px;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
        z-index: 50;
      }

      .btn {
        padding: 12px 26px;
        background: linear-gradient(to right, #ff85a2, #ff3366);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 30px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 5px 18px rgba(255, 51, 102, 0.5);
        transition: all 0.3s ease;
        outline: none;
      }

      .btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 25px rgba(255, 51, 102, 0.7);
      }

      @media (max-width: 768px) {
        .cake-title { font-size: 1.8rem; }
        .cake-container { width: 320px; height: 300px; }
        .cake { width: 240px; }
        .nav-buttons { padding: 0 20px; bottom: 20px; }
        .btn { padding: 10px 18px; font-size: 15px; }
      }

      @media (max-width: 480px) {
        .cake-title { font-size: 1.5rem; }
        .cake-container { width: 290px; height: 280px; }
        .cake { width: 220px; height: 110px; }
        .candle-row-top { gap: 8px; top: -105px; }
        .candle-row-bottom { gap: 9px; top: -58px; }
        .candle { width: 5.5px; height: 24px; }
        .flame { width: 8px; height: 15px; top: -15px; }
        .nav-buttons { padding: 0 15px; bottom: 15px; }
        .btn { padding: 9px 14px; font-size: 14px; }
      }
    </style>
  </head>
  <body>
    <h1 class="cake-title">Blow Out Your 20 Candles, Chubbi! 🕯️✨</h1>

    <!-- Birthday Cake with 20 Candles -->
    <div class="cake-container">
      <div class="cake">
        <!-- Row 1 (top tier): 10 candles -->
        <div class="candle-row candle-row-top" id="candleRowTop"></div>
        <!-- Row 2 (middle tier): 10 candles -->
        <div class="candle-row candle-row-bottom" id="candleRowBottom"></div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 15px; z-index: 20;">
      <button class="btn" onclick="blowAllCandles()" style="font-size: 0.95rem; padding: 9px 22px; background: rgba(255, 255, 255, 0.22); border: 1px solid rgba(255, 255, 255, 0.6); backdrop-filter: blur(8px);">
        💨 Blow Out All 20 Candles
      </button>
    </div>

    <!-- Enhanced Wish Message Popup -->
    <div class="wish-message" id="wishMessage">
      <h2>✨ Happy 20th Birthday, Chubbi! ✨</h2>
      <p>Make a wish, my prettiest girl! May your 20s be filled with endless love, happiness, laughter, and all your dreams coming true! 🎂❤️</p>
      <button class="btn" onclick="closeWishMessage()">Thank you, my love! ❤️</button>
    </div>

    <!-- Navigation Buttons -->
    <div class="nav-buttons">
      <button class="btn" onclick="goBack()">◀ Back to Memory Lane</button>
      <button class="btn" onclick="goNext()">Your Love Letter ▶</button>
    </div>

    <!-- Scripts -->
    <script src="assets/js/audio-controller.js"></script>
    <script>
      let candlesBlown = 0;
      const totalCandles = 20;
      let allCandlesBlown = false;

      document.addEventListener("DOMContentLoaded", function () {
        createCandles();
        createBalloons();
        createConfetti();

        document.querySelectorAll(".candle").forEach((candle) => {
          candle.addEventListener("click", blowOutCandle);
          candle.addEventListener("touchstart", blowOutCandle);
          candle.addEventListener("mouseover", function (e) {
            if (e.buttons === 0) {
              blowOutCandle.call(this);
            }
          });
        });

        document.addEventListener("touchmove", function (e) {
          const touch = e.touches[0];
          const element = document.elementFromPoint(touch.clientX, touch.clientY);
          if (element && element.classList.contains("candle") && !element.classList.contains("blown")) {
            blowOutCandle.call(element);
          }
        });

        document.addEventListener("keypress", function (e) {
          if (e.key === "b" || e.key === "B") {
            blowRandomCandle();
          }
        });
      });

      function createCandles() {
        const topRow = document.getElementById("candleRowTop");
        const bottomRow = document.getElementById("candleRowBottom");

        // 10 on top, 10 on bottom = 20 total
        for (let i = 0; i < 10; i++) {
          topRow.appendChild(makeCandle());
          bottomRow.appendChild(makeCandle());
        }
      }

      function makeCandle() {
        const candle = document.createElement("div");
        candle.className = "candle";
        const flame = document.createElement("div");
        flame.className = "flame";
        const smoke = document.createElement("div");
        smoke.className = "smoke";

        candle.appendChild(flame);
        candle.appendChild(smoke);
        return candle;
      }

      function createBalloons() {
        const colors = ["#ff66b3", "#66ccff", "#ff9966", "#ffd166", "#cc99ff"];
        for (let i = 0; i < 15; i++) {
          const balloon = document.createElement("div");
          balloon.className = "balloon";
          balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          balloon.style.left = `${Math.random() * 100}%`;
          balloon.style.animationDuration = `${15 + Math.random() * 10}s`;
          balloon.style.animationDelay = `${Math.random() * 5}s`;
          document.body.appendChild(balloon);
        }
      }

      function createConfetti() {
        const colors = ["#ffcc00", "#ff66b3", "#66ccff", "#ff9966", "#ffd166"];
        for (let i = 0; i < 40; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti";
          confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.left = `${Math.random() * 100}%`;
          confetti.style.width = `${5 + Math.random() * 5}px`;
          confetti.style.height = `${5 + Math.random() * 10}px`;
          confetti.style.animationDuration = `${3 + Math.random() * 4}s`;
          confetti.style.animationDelay = `${Math.random() * 5}s`;
          document.body.appendChild(confetti);
        }
      }

      function blowOutCandle() {
        const candle = this.closest('.candle') || this;
        if (!candle.classList.contains("blown")) {
          candle.classList.add("blown");
          candlesBlown++;
          createSparkleEffect(candle);

          if (candlesBlown >= totalCandles && !allCandlesBlown) {
            allCandlesBlown = true;
            setTimeout(showWishMessage, 800);
          }
        }
      }

      function blowAllCandles() {
        const unblown = Array.from(document.querySelectorAll(".candle:not(.blown)"));
        unblown.forEach((candle, idx) => {
          setTimeout(() => {
            blowOutCandle.call(candle);
          }, idx * 60);
        });
      }

      function blowRandomCandle() {
        const unblownCandles = Array.from(document.querySelectorAll(".candle:not(.blown)"));
        if (unblownCandles.length > 0) {
          const randomCandle = unblownCandles[Math.floor(Math.random() * unblownCandles.length)];
          blowOutCandle.call(randomCandle);
        }
      }

      function createSparkleEffect(candle) {
        const candleRect = candle.getBoundingClientRect();
        for (let i = 0; i < 8; i++) {
          const sparkle = document.createElement("div");
          sparkle.className = "sparkle";
          sparkle.style.left = `${candleRect.left + Math.random() * candleRect.width}px`;
          sparkle.style.top = `${candleRect.top + Math.random() * (candleRect.height / 2)}px`;
          sparkle.style.animation = `sparkle ${0.5 + Math.random() * 0.5}s forwards`;
          document.body.appendChild(sparkle);

          setTimeout(() => {
            if (sparkle.parentNode) sparkle.parentNode.removeChild(sparkle);
          }, 1000);
        }
      }

      function showWishMessage() {
        document.getElementById("wishMessage").classList.add("show");
        createFireworks();
      }

      function closeWishMessage() {
        document.getElementById("wishMessage").classList.remove("show");
      }

      function createFireworks() {
        const colors = ["#ff3366", "#ffcc00", "#66ccff", "#ff9966", "#ffd166"];
        for (let i = 0; i < 12; i++) {
          setTimeout(() => {
            const firework = document.createElement("div");
            firework.className = "firework";
            firework.style.left = `${10 + Math.random() * 80}%`;
            firework.style.top = `${10 + Math.random() * 60}%`;
            firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            firework.style.animation = `firework ${1 + Math.random()}s forwards`;
            document.body.appendChild(firework);

            setTimeout(() => {
              if (firework.parentNode) firework.parentNode.removeChild(firework);
            }, 2000);
          }, i * 250);
        }
      }

      function goBack() {
        window.location.href = "memorylane.html";
      }

      function goNext() {
        window.location.href = "letter.html";
      }
    </script>
  </body>
</html>
