<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Lane - Chubbi's 20th Birthday ✨</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap");

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }

      body {
        background: transparent;
        min-height: 100vh;
        overflow-x: hidden;
        position: relative;
        color: #ffffff;
      }

      .confetti {
        position: fixed;
        width: 100%;
        height: 100%;
        z-index: 1;
        pointer-events: none;
      }

      .confetti-piece {
        position: absolute;
        width: 10px;
        height: 10px;
        top: -20px;
        opacity: 0;
      }

      .memory-lane-container {
        max-width: 1240px;
        margin: 0 auto;
        padding: 2.5rem 1.5rem 4rem 1.5rem;
        position: relative;
        z-index: 10;
      }

      .header {
        text-align: center;
        margin-bottom: 2.5rem;
        animation: float 3s ease-in-out infinite;
      }

      .header h1 {
        font-size: 3.5rem;
        color: #ffffff;
        margin-bottom: 0.8rem;
        font-family: "Pacifico", cursive;
        text-shadow: 0 0 20px rgba(255, 105, 180, 0.9), 0 0 35px rgba(255, 20, 147, 0.7);
        animation: heartbeat 1.8s ease-in-out infinite;
      }

      .header p {
        font-size: 1.25rem;
        color: #ffd6f1;
        max-width: 740px;
        margin: 0 auto;
        line-height: 1.6;
        background: rgba(15, 8, 25, 0.6);
        padding: 1rem 1.8rem;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
      }

      .gallery-container {
        position: relative;
        margin: 2rem 0;
      }

      .slideshow-controls {
        display: flex;
        justify-content: center;
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeIn 1s forwards 0.8s;
      }

      .btn {
        padding: 0.85rem 1.8rem;
        margin: 0 0.5rem;
        background: linear-gradient(45deg, #ff6ec4, #7873f5);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 25px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 600;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 18px rgba(255, 110, 196, 0.5);
      }

      .btn:hover {
        background: linear-gradient(45deg, #7873f5, #ff6ec4);
        transform: translateY(-2px) scale(1.05);
        box-shadow: 0 6px 24px rgba(255, 110, 196, 0.7);
      }

      .btn i {
        margin-right: 0.5rem;
      }

      .gallery {
        display: flex;
        flex-wrap: nowrap;
        overflow-x: auto;
        gap: 1.8rem;
        padding: 2rem 1rem;
        -webkit-overflow-scrolling: touch;
        scroll-behavior: smooth;
        scrollbar-width: thin;
        scrollbar-color: #ff6ec4 rgba(255, 255, 255, 0.2);
      }

      .gallery::-webkit-scrollbar {
        height: 10px;
      }

      .gallery::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }

      .gallery::-webkit-scrollbar-thumb {
        background: linear-gradient(45deg, #ff6ec4, #8A2BE2);
        border-radius: 10px;
      }

      .memory-card {
        flex: 0 0 auto;
        width: 310px;
        height: 420px;
        position: relative;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 105, 180, 0.35);
        transform: translateY(50px) rotate(var(--rotate, 0deg));
        opacity: 0;
        transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        border: 10px solid white;
        background: white;
        cursor: pointer;
      }

      .memory-card:hover {
        transform: translateY(-8px) scale(1.03) rotate(0deg) !important;
        box-shadow: 0 18px 40px rgba(255, 20, 147, 0.5), 0 0 30px rgba(255, 255, 255, 0.5);
        z-index: 5;
      }

      .memory-card.visible {
        transform: translateY(0) rotate(var(--rotate, 0deg));
        opacity: 1;
      }

      .memory-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.5s ease;
        display: block;
      }

      .memory-card:hover .memory-img {
        transform: scale(1.06);
      }

      .card-tape {
        position: absolute;
        width: 100px;
        height: 35px;
        background: rgba(255, 255, 255, 0.85);
        top: -15px;
        left: 50%;
        transform: translateX(-50%) rotate(var(--rotate, 2deg));
        z-index: 3;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      }

      .card-sticker {
        position: absolute;
        width: 44px;
        height: 44px;
        z-index: 4;
        bottom: 12px;
        right: 12px;
        transform: rotate(15deg);
        filter: drop-shadow(0 3px 6px rgba(0, 0, 0, 0.4));
        animation: bounce 2.2s infinite;
      }

      /* Photo Lightbox Modal */
      .photo-lightbox {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        background: rgba(10, 5, 20, 0.94) !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        z-index: 100005 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition: opacity 0.3s ease, visibility 0.3s ease;
        padding: 20px;
        user-select: none;
      }

      .photo-lightbox.active {
        opacity: 1 !important;
        visibility: visible !important;
        pointer-events: auto !important;
      }

      .lightbox-content-wrap {
        position: relative;
        max-width: 92vw;
        max-height: 82vh;
        display: flex;
        justify-content: center;
        align-items: center;
        transform: scale(0.92);
        transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .photo-lightbox.active .lightbox-content-wrap {
        transform: scale(1);
      }

      .lightbox-img {
        max-width: 88vw;
        max-height: 78vh;
        width: auto;
        height: auto;
        object-fit: contain;
        border-radius: 16px;
        border: 4px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 15px 50px rgba(0, 0, 0, 0.8), 0 0 35px rgba(255, 105, 180, 0.5);
        background: #150d22;
        transition: opacity 0.25s ease;
      }

      .lightbox-close {
        position: absolute;
        top: 25px;
        right: 25px;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white;
        font-size: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        z-index: 100002;
        backdrop-filter: blur(8px);
      }

      .lightbox-close:hover {
        background: rgba(255, 20, 147, 0.85);
        transform: scale(1.12);
      }

      .lightbox-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.18);
        border: 1px solid rgba(255, 255, 255, 0.4);
        color: white;
        font-size: 26px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.25s ease;
        z-index: 100001;
        backdrop-filter: blur(8px);
      }

      .lightbox-nav-btn:hover {
        background: rgba(255, 20, 147, 0.85);
        transform: translateY(-50%) scale(1.12);
      }

      .lightbox-prev { left: 30px; }
      .lightbox-next { right: 30px; }

      .lightbox-counter {
        margin-top: 14px;
        font-size: 1.05rem;
        font-weight: 600;
        color: #ffd6f1;
        letter-spacing: 1px;
        background: rgba(20, 10, 30, 0.75);
        padding: 6px 20px;
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.25);
        backdrop-filter: blur(8px);
      }

      @media (max-width: 768px) {
        .lightbox-nav-btn { width: 42px; height: 42px; font-size: 20px; }
        .lightbox-prev { left: 10px; }
        .lightbox-next { right: 10px; }
        .lightbox-close { top: 15px; right: 15px; width: 42px; height: 42px; font-size: 22px; }
      }

      .navigation-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 3rem;
      }

      #nextButton {
        background: linear-gradient(45deg, #ff4e91, #ff9a8b);
        font-size: 1.15rem;
        padding: 1rem 2.2rem;
        position: relative;
        overflow: hidden;
        animation: pulse 2s infinite;
        border: 2px solid rgba(255, 255, 255, 0.6);
      }

      #nextButton:hover {
        transform: translateY(-4px) scale(1.05);
        box-shadow: 0 8px 25px rgba(255, 78, 145, 0.7);
      }

      #backButton {
        background: linear-gradient(45deg, #a485ff, #75c6ff);
        border: 2px solid rgba(255, 255, 255, 0.6);
      }



      @keyframes float {
        0%, 100% { transform: translateY(0) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }

      @keyframes bounce {
        0%, 100% { transform: scale(1) rotate(15deg); }
        50% { transform: scale(1.15) rotate(22deg); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 110, 196, 0.5); }
        50% { transform: scale(1.05); box-shadow: 0 10px 25px rgba(255, 110, 196, 0.8); }
        100% { transform: scale(1); box-shadow: 0 4px 15px rgba(255, 110, 196, 0.5); }
      }

      @keyframes heartbeat {
        0%, 100% { transform: scale(1); }
        25%, 75% { transform: scale(1.04); }
        50% { transform: scale(1); }
      }

      @keyframes floatDown {
        0% { transform: translateY(-10px) rotate(0); opacity: 1; }
        100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
      }

      @media (max-width: 768px) {
        .header h1 { font-size: 2.5rem; }
        .memory-card { width: 260px; height: 350px; }
        .gallery { gap: 1.2rem; }
      }

      @media (max-width: 480px) {
        .header h1 { font-size: 2rem; }
        .header p { font-size: 1.05rem; }
        .memory-card { width: 230px; height: 310px; }
        .navigation-buttons { flex-direction: column; gap: 1rem; align-items: center; }
        .btn { width: 100%; max-width: 220px; }
      }
    </style>
  </head>
  <body>
    <div class="confetti" id="confetti-container"></div>

    <div class="memory-lane-container">
      <div class="header">
        <h1>Our Memory Lane ✨</h1>
        <p>
          Celebrating my gorgeous girl Chubbi on her 20th Birthday ❤️ Every single moment with you is my favourite memory.
        </p>
      </div>



      <div class="gallery-container">
        <div class="slideshow-controls">
          <button id="startSlideshow" class="btn">
            <i>▶</i> Start Memory Slideshow
          </button>
          <button id="pauseSlideshow" class="btn" style="display: none">
            <i>⏸</i> Pause Slideshow
          </button>
        </div>

        <div class="gallery" id="memoryGallery">
          <!-- Memory cards from photos folder -->
        </div>
      </div>

      <div class="navigation-buttons">
        <button id="backButton" class="btn">
          <span>← Back to Welcome</span>
        </button>
        <button id="nextButton" class="btn">
          <span>✨ Next Surprise! ✨</span>
        </button>
      </div>
    </div>

    <!-- Photo Lightbox Modal -->
    <div class="photo-lightbox" id="photoLightbox" role="dialog" aria-modal="true" aria-label="Photo Viewer">
      <button class="lightbox-close" id="lightboxClose" aria-label="Close viewer">✕</button>
      <button class="lightbox-nav-btn lightbox-prev" id="lightboxPrev" aria-label="Previous photo">❮</button>
      <button class="lightbox-nav-btn lightbox-next" id="lightboxNext" aria-label="Next photo">❯</button>
      <div class="lightbox-content-wrap" id="lightboxWrap">
        <img src="" alt="Photo of Chubbi Full View" class="lightbox-img" id="lightboxImg">
      </div>
      <div class="lightbox-counter" id="lightboxCounter">1 / 13 💕</div>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/ScrollTrigger.min.js"></script>
    <script src="assets/js/audio-controller.js"></script>

    <script>
      gsap.registerPlugin(ScrollTrigger);

      // Photos from the photos folder (no pop-up text underneath)
      const photoFiles = [
        "photos/IMG_5192.jpg",
        "photos/IMG_5354.jpg",
        "photos/IMG_5541.jpg",
        "photos/IMG_5679.JPG",
        "photos/IMG_5879.jpg",
        "photos/IMG_7040.jpg",
        "photos/IMG_7389.jpg",
        "photos/IMG_7834.jpg",
        "photos/359641ac-4379-4ae2-a7ed-37e95aad1eae.jpg",
        "photos/6e2bc75f-fec8-4a87-a427-77fa70730c48.jpg",
        "photos/772ec362-a634-42b4-a370-e8e8e9b58a31.jpg",
        "photos/99f7342d-41fa-4369-9d54-4d5a254ef1db.jpg",
        "photos/e79d4f1e-5c01-447c-8fed-46954ad62105.jpg"
      ];

      const emojis = ["💖", "🥰", "✨", "🦋", "🌹", "👑", "💘", "💋", "💫", "🧸", "💕", "🤍", "🎂"];
      const angles = [-3, 2, -2, 3, -1, 2, -2, 3, -1, 2, -3, 1, 2];

      function createConfetti() {
        const confettiContainer = document.getElementById("confetti-container");
        if (!confettiContainer) return;
        const colors = ["#ff6ec4", "#a485ff", "#ff4e91", "#ffd166", "#75c6ff"];

        for (let i = 0; i < 50; i++) {
          const confetti = document.createElement("div");
          confetti.className = "confetti-piece";

          confetti.style.left = Math.random() * 100 + "vw";
          confetti.style.width = Math.random() * 12 + 6 + "px";
          confetti.style.height = Math.random() * 12 + 6 + "px";
          confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
          confetti.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
          confetti.style.transform = `rotate(${Math.random() * 360}deg)`;

          const duration = Math.random() * 3 + 3;
          const delay = Math.random() * 4;

          confetti.style.animation = `floatDown ${duration}s ease-in ${delay}s infinite`;
          confetti.style.opacity = Math.random() * 0.8 + 0.2;

          confettiContainer.appendChild(confetti);
        }
      }

      document.addEventListener("DOMContentLoaded", function () {
        createConfetti();

        const galleryElement = document.getElementById("memoryGallery");
        const startSlideshowBtn = document.getElementById("startSlideshow");
        const pauseSlideshowBtn = document.getElementById("pauseSlideshow");
        const backButton = document.getElementById("backButton");
        const nextButton = document.getElementById("nextButton");

        const lightbox = document.getElementById("photoLightbox");
        const lightboxImg = document.getElementById("lightboxImg");
        const lightboxCounter = document.getElementById("lightboxCounter");
        const lightboxClose = document.getElementById("lightboxClose");
        const lightboxPrev = document.getElementById("lightboxPrev");
        const lightboxNext = document.getElementById("lightboxNext");
        let activePhotoIndex = 0;

        window.openLightbox = function(index) {
          activePhotoIndex = index;
          updateLightboxPhoto();
          if (lightbox) {
            lightbox.classList.add("active");
          }
          document.body.style.overflow = "hidden";
        };

        window.closeLightbox = function() {
          if (lightbox) {
            lightbox.classList.remove("active");
          }
          document.body.style.overflow = "";
        };

        function updateLightboxPhoto() {
          if (!lightboxImg) return;
          lightboxImg.style.opacity = "0.3";
          lightboxImg.src = photoFiles[activePhotoIndex];
          lightboxImg.onload = () => {
            lightboxImg.style.opacity = "1";
          };
          if (lightboxCounter) {
            lightboxCounter.textContent = `${activePhotoIndex + 1} / ${photoFiles.length} 💕`;
          }
        }

        window.showNextPhoto = function() {
          activePhotoIndex = (activePhotoIndex + 1) % photoFiles.length;
          updateLightboxPhoto();
        };

        window.showPrevPhoto = function() {
          activePhotoIndex = (activePhotoIndex - 1 + photoFiles.length) % photoFiles.length;
          updateLightboxPhoto();
        };

        if (lightboxClose) lightboxClose.addEventListener("click", window.closeLightbox);
        if (lightboxNext) lightboxNext.addEventListener("click", (e) => { e.stopPropagation(); window.showNextPhoto(); });
        if (lightboxPrev) lightboxPrev.addEventListener("click", (e) => { e.stopPropagation(); window.showPrevPhoto(); });

        if (lightbox) {
          lightbox.addEventListener("click", (e) => {
            if (e.target === lightbox || e.target.id === "lightboxWrap") {
              window.closeLightbox();
            }
          });
        }

        document.addEventListener("keydown", (e) => {
          if (!lightbox || !lightbox.classList.contains("active")) return;
          if (e.key === "Escape") window.closeLightbox();
          if (e.key === "ArrowRight") window.showNextPhoto();
          if (e.key === "ArrowLeft") window.showPrevPhoto();
        });

        // Touch swipe on mobile
        let touchStartX = 0;
        let touchEndX = 0;
        if (lightbox) {
          lightbox.addEventListener("touchstart", (e) => {
            touchStartX = e.changedTouches[0].screenX;
          }, { passive: true });
          lightbox.addEventListener("touchend", (e) => {
            touchEndX = e.changedTouches[0].screenX;
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 45) {
              if (diff > 0) window.showNextPhoto();
              else window.showPrevPhoto();
            }
          }, { passive: true });
        }

        let slideshowInterval;
        let currentSlide = 0;

        // Render Memory Cards without text underneath
        photoFiles.forEach((photoSrc, index) => {
          const rot = angles[index % angles.length];
          const emoji = emojis[index % emojis.length];

          const memoryCard = document.createElement("div");
          memoryCard.className = "memory-card";
          memoryCard.title = "Click to view full photo";
          memoryCard.style.setProperty("--rotate", `${rot}deg`);
          memoryCard.setAttribute("onclick", `openLightbox(${index})`);

          const tapeElement = document.createElement("div");
          tapeElement.className = "card-tape";
          tapeElement.style.setProperty("--rotate", `${rot * 1.5}deg`);

          const imgElement = document.createElement("img");
          imgElement.className = "memory-img";
          imgElement.src = photoSrc;
          imgElement.alt = `Photo of Chubbi ${index + 1}`;
          imgElement.loading = "lazy";

          const stickerElement = document.createElement("div");
          stickerElement.className = "card-sticker";
          stickerElement.innerHTML = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="50" cy="50" r="50" fill="#ff6ec4" />
                    <text x="50" y="66" font-family="Arial" font-size="42" text-anchor="middle" fill="white">${emoji}</text>
                </svg>`;

          memoryCard.appendChild(tapeElement);
          memoryCard.appendChild(imgElement);
          memoryCard.appendChild(stickerElement);

          // Clicking photo card opens the lightbox
          memoryCard.addEventListener("click", () => {
            window.openLightbox(index);
          });

          galleryElement.appendChild(memoryCard);
        });

        document.querySelector(".slideshow-controls").style.opacity = "1";

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("visible");
                observer.unobserve(entry.target);
              }
            });
          },
          { threshold: 0.15 }
        );

        document.querySelectorAll(".memory-card").forEach((card, index) => {
          observer.observe(card);
          card.style.animationDelay = `${0.06 * index}s`;

          setTimeout(() => {
            card.classList.add("visible");
          }, 250 + index * 90);
        });

        function startSlideshow() {
          startSlideshowBtn.style.display = "none";
          pauseSlideshowBtn.style.display = "flex";

          if (slideshowInterval) clearInterval(slideshowInterval);

          slideshowInterval = setInterval(() => {
            currentSlide = (currentSlide + 1) % photoFiles.length;
            const cards = galleryElement.querySelectorAll(".memory-card");
            if (cards && cards.length > 0 && cards[currentSlide]) {
              const cardRect = cards[currentSlide].getBoundingClientRect();
              const galleryRect = galleryElement.getBoundingClientRect();

              galleryElement.scrollTo({
                left:
                  cards[currentSlide].offsetLeft -
                  galleryRect.width / 2 +
                  cardRect.width / 2,
                behavior: "smooth",
              });
            }
          }, 2400);
        }

        function pauseSlideshow() {
          pauseSlideshowBtn.style.display = "none";
          startSlideshowBtn.style.display = "flex";

          if (slideshowInterval) {
            clearInterval(slideshowInterval);
            slideshowInterval = null;
          }
        }

        startSlideshowBtn.addEventListener("click", startSlideshow);
        pauseSlideshowBtn.addEventListener("click", pauseSlideshow);

        backButton.addEventListener("click", function () {
          window.location.href = "index.html";
        });

        nextButton.addEventListener("click", function () {
          window.location.href = "cake.html";
        });

        gsap.from(".header", {
          duration: 1,
          y: -40,
          opacity: 0,
          ease: "back.out(1.7)",
        });

        gsap.from(".navigation-buttons", {
          duration: 1,
          y: 40,
          opacity: 0,
          delay: 0.3,
          ease: "power3.out",
        });
      });
    </script>
  </body>
</html>
