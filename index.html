<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy 20th Birthday, Chubbi! 💖</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', cursive, sans-serif;
        }

        body {
            background: transparent;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Entry Screen / Autoplay Unlock Overlay */
        .entry-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 5, 20, 0.45);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            cursor: pointer;
            transition: opacity 0.8s ease, transform 0.8s ease, visibility 0.8s ease;
        }

        .entry-overlay.hidden {
            opacity: 0;
            transform: scale(1.08);
            visibility: hidden;
            pointer-events: none;
        }

        .entry-card {
            background: rgba(255, 255, 255, 0.12);
            padding: 3rem 2.5rem;
            border-radius: 30px;
            box-shadow: 0 15px 45px rgba(255, 20, 147, 0.35), 0 0 30px rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            max-width: 480px;
            width: 90%;
            animation: pulseCard 2.5s infinite ease-in-out;
        }

        .entry-icon {
            font-size: 4.2rem;
            margin-bottom: 1.2rem;
            animation: bounceGift 1.8s infinite ease-in-out;
            display: inline-block;
        }

        .entry-title {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 0.8rem;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.9);
        }

        .entry-subtitle {
            font-size: 1.25rem;
            color: #ffd6f1;
            margin-bottom: 1.8rem;
            line-height: 1.5;
        }

        .entry-button {
            padding: 0.95rem 2.6rem;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #FF1493, #8A2BE2);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
        }

        .entry-button:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 25px rgba(255, 20, 147, 0.8);
        }

        @keyframes bounceGift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(6deg); }
        }

        @keyframes pulseCard {
            0%, 100% { box-shadow: 0 15px 40px rgba(255, 20, 147, 0.35); }
            50% { box-shadow: 0 15px 50px rgba(255, 20, 147, 0.6); }
        }

        /* Main Container */
        .container {
            text-align: center;
            z-index: 10;
            padding: 2.5rem 2rem;
            max-width: 820px;
            background: rgba(20, 10, 30, 0.45);
            border-radius: 26px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), 0 0 30px rgba(255, 105, 180, 0.3);
            transition: all 0.5s ease;
        }

        .container:hover {
            box-shadow: 0 15px 50px rgba(255, 105, 180, 0.5);
            border-color: rgba(255, 182, 193, 0.6);
        }

        h1 {
            font-size: 3.6rem;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 20, 147, 0.9), 0 0 35px rgba(255, 105, 180, 0.7);
            margin-bottom: 1.5rem;
            opacity: 0;
            animation: bounce-in 1.5s forwards 0.5s;
            line-height: 1.25;
        }

        .subtitle {
            font-size: 1.7rem;
            color: #ffd6f1;
            margin-bottom: 2rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            opacity: 0;
        }

        .next-button {
            padding: 1rem 3.2rem;
            font-size: 1.5rem;
            background: linear-gradient(45deg, #FF1493, #8A2BE2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255, 20, 147, 0.6);
            transition: all 0.3s ease;
            opacity: 0;
            animation: fade-in 1s forwards 2.8s;
        }

        .next-button:hover {
            transform: scale(1.06) translateY(-4px);
            box-shadow: 0 8px 25px rgba(255, 20, 147, 0.85);
            background: linear-gradient(45deg, #8A2BE2, #FF1493);
        }

        .confetti, .balloon, .heart, .star {
            position: absolute;
            width: 20px;
            height: 20px;
            background-size: contain;
            background-repeat: no-repeat;
            z-index: 2;
            opacity: 0.85;
            pointer-events: none;
        }

        .balloon {
            width: 40px;
            height: 50px;
        }

        .heart {
            width: 25px;
            height: 25px;
        }

        .star {
            width: 15px;
            height: 15px;
        }

        @keyframes bounce-in {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            60% {
                transform: scale(1.1);
                opacity: 1;
            }
            80% {
                transform: scale(0.9);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes fade-in {
            0% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes typewriter {
            from {
                width: 0;
            }
            to {
                width: 100%;
            }
        }

        .typewriter-container {
            display: inline-block;
            margin: 0 auto;
            position: relative;
            max-width: 100%;
            overflow: hidden;
            height: 2.5rem;
        }

        .typewriter-text {
            position: relative;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            animation: typewriter 2.8s steps(50) forwards 1.2s;
        }

        .cursor {
            position: absolute;
            right: -5px;
            width: 3px;
            height: 100%;
            background-color: #ff6ec4;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.4rem;
            }
            .subtitle {
                font-size: 1.2rem;
            }
            .container {
                width: 90%;
                padding: 1.8rem 1.4rem;
            }
            .next-button {
                padding: 0.85rem 2.2rem;
                font-size: 1.25rem;
            }
            .entry-card {
                padding: 2.2rem 1.6rem;
            }
            .entry-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <!-- Tasteful "Tap to open your surprise" entry screen -->
    <div class="entry-overlay" id="entryOverlay" onclick="openSurprise()">
        <div class="entry-card">
            <div class="entry-icon">🎁</div>
            <h2 class="entry-title">A Special Surprise</h2>
            <p class="entry-subtitle">For my gorgeous girl Chubbi on her 20th Birthday ✨<br>24th October • Turn your volume up!</p>
            <button class="entry-button" type="button">Tap to Open 💖</button>
        </div>
    </div>

    <div class="container">
        <h1>
            Happy 20th Birthday,<br>Chubbi! 🎉🎂
        </h1>
        <div class="typewriter-container">
            <div class="subtitle typewriter-text">
                Hey my love! Ready for your special surprise? Click to continue!
                <span class="cursor"></span>
            </div>
        </div>
        <br>
        <button class="next-button" onclick="goToNextPage()">Let's Go! ✨</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="assets/js/audio-controller.js"></script>
    <script>
        function openSurprise() {
            const overlay = document.getElementById('entryOverlay');
            if (overlay) {
                overlay.classList.add('hidden');
            }

            if (window.BgMusicController && typeof window.BgMusicController.start === 'function') {
                window.BgMusicController.start();
            }

            if (typeof createFloatingElements === 'function') {
                createFloatingElements();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem('bgMusicPlaying') === 'true') {
                const overlay = document.getElementById('entryOverlay');
                if (overlay) {
                    overlay.classList.add('hidden');
                }
            }
        });

        function goToNextPage() {
            gsap.to('.next-button', {
                scale: 1.2,
                yoyo: true,
                repeat: 1,
                duration: 0.3,
                onComplete: () => {
                    window.location.href = "memorylane.html";
                }
            });
        }

        function createFloatingElements() {
            const colors = ['#FF1493', '#8A2BE2', '#FFD700', '#FF4500', '#00BFFF', '#32CD32'];
            const elements = ['confetti', 'balloon', 'heart', 'star'];
            const confettiShapes = ['▲', '■', '●', '★', '♥', '♦', '✦', '✧'];
            
            for (let i = 0; i < 70; i++) {
                setTimeout(() => {
                    const element = document.createElement('div');
                    const elementType = elements[Math.floor(Math.random() * elements.length)];
                    element.className = elementType;
                    
                    element.style.left = Math.random() * 100 + 'vw';
                    element.style.top = -30 + 'px';
                    
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    
                    if (elementType === 'confetti') {
                        const shape = confettiShapes[Math.floor(Math.random() * confettiShapes.length)];
                        element.innerHTML = shape;
                        element.style.color = color;
                        element.style.fontSize = (Math.random() * 20 + 10) + 'px';
                        element.style.transform = `rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'balloon') {
                        element.innerHTML = '🎈';
                        element.style.fontSize = (Math.random() * 30 + 20) + 'px';
                        element.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'heart') {
                        element.innerHTML = '❤️';
                        element.style.fontSize = (Math.random() * 20 + 10) + 'px';
                        element.style.filter = `hue-rotate(${Math.random() * 360}deg)`;
                    } else if (elementType === 'star') {
                        element.innerHTML = '✨';
                        element.style.fontSize = (Math.random() * 15 + 10) + 'px';
                    }
                    
                    document.body.appendChild(element);
                    
                    gsap.to(element, {
                        y: window.innerHeight + 100,
                        x: '+=' + (Math.random() * 200 - 100),
                        rotation: Math.random() * 360,
                        duration: Math.random() * 10 + 5,
                        ease: "power1.out",
                        onComplete: () => {
                            if (element.parentNode) {
                                element.parentNode.removeChild(element);
                            }
                        }
                    });
                    
                    if (Math.random() > 0.7) {
                        gsap.to(element, {
                            opacity: 0.5,
                            yoyo: true,
                            repeat: -1,
                            duration: 0.5,
                            ease: "sine.inOut"
                        });
                    }
                }, i * 180);
            }
        }

        window.addEventListener('load', createFloatingElements);
        setInterval(createFloatingElements, 6000);
    </script>
</body>
</html>
